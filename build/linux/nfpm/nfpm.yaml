# nfpm 配置（deb / rpm / archlinux）
# GENERATED from template/build/linux/nfpm/nfpm.yaml.template — do not edit the generated file directly.
# Edit the template or app.config.json, then run `wails3 task generate:build:config`.
# Documentation: https://nfpm.goreleaser.com

name: "SuperSender"
arch: ${GOARCH}
platform: "linux"
version: "1.2.1"
section: "net"
priority: "optional"
maintainer: "心歌 <eclipse8@qq.com>"
description: "运维测试助手 — 网络发包测试工具"
vendor: "心歌"
homepage: "https://gitcode.com/qq_23994787/SuperSender"
license: "MIT"
release: "1"

contents:
  # nfpm 默认按 0644 打包普通文件，二进制必须显式给执行位
  - src: "./build/linux/build/SuperSender"
    dst: "/usr/local/bin/SuperSender"
    file_info:
      mode: 0755
  # 全尺寸 hicolor 图标：供 .desktop 启动器与系统托盘按面板尺寸就近选取
  - src: "./build/linux/icons/hicolor/16x16/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/22x22/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/22x22/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/24x24/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/24x24/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/32x32/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/48x48/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/64x64/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/128x128/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/256x256/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/SuperSender.png"
    file_info:
      mode: 0644
  - src: "./build/linux/icons/hicolor/512x512/apps/SuperSender.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/SuperSender.png"
    file_info:
      mode: 0644
  # 桌面项文件名必须等于反域名 ID（productIdentifier），
  # GNOME 才能把 Wayland app_id / X11 WM_CLASS 关联到启动器
  - src: "./build/linux/SuperSender.desktop"
    dst: "/usr/share/applications/com.supersender.net.desktop"
    file_info:
      mode: 0644

# GTK4 + WebKitGTK 6.0 运行时依赖（Ubuntu 24.04+ / Debian 13+ / Fedora 40+）
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
